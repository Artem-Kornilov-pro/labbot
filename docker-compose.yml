services:
  labbot:
    build: .
    image: labbot:latest
    env_file: .env
    restart: unless-stopped
    volumes:
      - labbot-data:/app/data   # SQLite с учётом выданных лаб
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  labbot-data:
